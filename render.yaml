databases:
  - name: fisai-checkin-db
    databaseName: fisai_checkin
    user: fisai
    plan: free

services:
  - type: web
    name: fisai-checkin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fisai-checkin-db
          property: connectionString
      - key: STAFF_API_KEY
        generateValue: true
      - key: DUPLICATE_WINDOW_SECONDS
        value: "60"
      - key: PORT
        value: "3000"
